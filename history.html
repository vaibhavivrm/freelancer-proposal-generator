<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Proposals - PropelWrite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-zinc-950 text-zinc-100 min-h-screen">

  <div class="max-w-6xl mx-auto px-6 py-12">
    
    <div class="flex justify-between items-center mb-10">
      <button onclick="window.location.href='index.html'" 
        class="flex items-center gap-2 text-violet-400 hover:text-white">
        ← Back to Generator
      </button>

      <button onclick="clearAllHistory()" 
        class="flex items-center gap-2 px-6 py-3 bg-red-600 hover:bg-red-700 rounded-3xl font-medium">
        <i class="fa-solid fa-trash"></i> Clear All History
      </button>
    </div>

    <h1 class="text-4xl font-bold mb-10">My Saved Proposals</h1>

    <div id="historyGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

    <div id="emptyState" class="hidden text-center py-20">
      <i class="fa-solid fa-folder-open text-6xl text-zinc-700 mb-4"></i>
      <p class="text-zinc-500 text-xl">No proposals yet. Generate some first!</p>
    </div>
  </div>

  <!-- 🔥 MODAL -->
  <div id="proposalModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center p-6 z-50">
    <div class="bg-zinc-900 max-w-3xl w-full p-8 rounded-3xl overflow-y-auto max-h-[80vh]">
      
      <div class="flex justify-between mb-6">
        <h2 class="text-2xl font-bold text-violet-400">Generated Proposal</h2>
        <button onclick="closeModal()" class="text-red-400 text-xl">✖</button>
      </div>

      <div id="modalContent" class="whitespace-pre-wrap text-zinc-300"></div>

    </div>
  </div>

  <script>
    let proposals = JSON.parse(localStorage.getItem('propelProposals')) || [];

    function renderHistory() {
      const container = document.getElementById('historyGrid');
      const empty = document.getElementById('emptyState');

      if (proposals.length === 0) {
        container.classList.add('hidden');
        empty.classList.remove('hidden');
        return;
      }

      container.classList.remove('hidden');
      empty.classList.add('hidden');

      container.innerHTML = proposals.map(p => `
        <div onclick="loadProposal(${p.id})" 
          class="bg-zinc-900 rounded-3xl p-6 border border-zinc-800 hover:border-violet-500 transition cursor-pointer">

          <div class="flex justify-between items-start">
            <h3 class="font-semibold text-xl line-clamp-1">${p.title}</h3>
            <span class="text-xs px-3 py-1 bg-zinc-800 rounded-full">${p.date}</span>
          </div>

          <p class="text-zinc-400 mt-2">${p.client} • ${p.role}</p>

          <p class="text-sm text-zinc-500 mt-4 line-clamp-3">
            ${p.desc ? p.desc.substring(0, 120) + '...' : 'No description'}
          </p>

          <div class="mt-6 flex justify-between items-center">

            <span class="text-xs uppercase tracking-wider 
              ${p.status === 'won' ? 'text-green-400' : 
                p.status === 'lost' ? 'text-red-400' : 'text-amber-400'}">
              ${p.status.toUpperCase()}
            </span>

            <div class="flex gap-3">
              <button onclick="event.stopPropagation(); viewProposal(${p.id})" 
                class="text-violet-400 hover:text-white text-sm">
                View
              </button>

              <button onclick="event.stopImmediatePropagation(); deleteSingleProposal(${p.id})" 
                class="text-red-400 hover:text-red-500 text-sm">
                Delete
              </button>
            </div>

          </div>
        </div>
      `).join('');
    }

    function loadProposal(id) {
      const prop = proposals.find(p => p.id === id);
      if (prop) {
        localStorage.setItem('currentProposal', JSON.stringify(prop));
        window.location.href = "proposal.html";
      }
    }

    function viewProposal(id) {
      const prop = proposals.find(p => p.id === id);

      const modal = document.getElementById("proposalModal");
      const content = document.getElementById("modalContent");

      content.innerText = prop.generated || "No generated proposal found.";
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function closeModal() {
      const modal = document.getElementById("proposalModal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    function deleteSingleProposal(id) {
      if (confirm("Delete this proposal?")) {
        proposals = proposals.filter(p => p.id !== id);
        localStorage.setItem('propelProposals', JSON.stringify(proposals));
        renderHistory();
      }
    }

    function clearAllHistory() {
      if (confirm("Delete ALL proposals?")) {
        proposals = [];
        localStorage.setItem('propelProposals', JSON.stringify(proposals));
        renderHistory();
      }
    }

    window.onload = renderHistory;
  </script>

</body>
</html>
