<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PropelWrite - Freelance Proposal Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    .glass {
      background: rgba(24, 24, 27, 0.95);
      backdrop-filter: blur(16px);
      border: 1px solid #3f3f46;
    }
    select, option {
      background: #18181b !important;
      color: #f1f5f9 !important;
    }
    .tone-btn.active {
      background-color: #7c3aed !important;
      color: white !important;
      border-color: #7c3aed !important;
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">

  <header class="border-b border-zinc-800 bg-zinc-950 sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-6 py-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-br from-violet-500 to-fuchsia-500 rounded-2xl flex items-center justify-center">
          <i class="fa-solid fa-rocket text-white text-2xl"></i>
        </div>
        <h1 class="text-3xl font-bold tracking-tighter">PropelWrite</h1>
      </div>
      <button onclick="goToHistory()" class="flex items-center gap-2 px-6 py-3 bg-zinc-900 hover:bg-zinc-800 rounded-3xl font-medium transition">
        <i class="fa-solid fa-history"></i> History (<span id="historyCount">0</span>)
      </button>
    </div>
  </header>

  <div class="max-w-4xl mx-auto px-6 py-16">
    <div class="text-center mb-14">
      <h1 class="text-5xl font-bold tracking-tighter mb-4">Generate Winning Freelance Proposals in Seconds</h1>
      <p class="text-xl text-zinc-400">Professional • Personalized • High-conversion</p>
    </div>

    <div class="glass rounded-3xl p-10">
      <div class="flex justify-between items-center mb-8">
        <h2 class="text-3xl font-semibold">Project Details</h2>
        <button onclick="clearForm()" class="text-zinc-400 hover:text-red-400 flex items-center gap-2">
          <i class="fa-solid fa-trash-can"></i> Clear Form
        </button>
      </div>

      <div class="space-y-8">
        <div>
          <label class="block text-sm font-medium mb-2 text-zinc-400">Client Name</label>
          <input id="clientName" type="text" class="w-full px-6 py-4 bg-zinc-900 border border-zinc-700 rounded-2xl focus:border-violet-500 text-lg" placeholder="e.g. Priya Sharma">
        </div>

        <div>
          <label class="block text-sm font-medium mb-2 text-zinc-400">Project Title</label>
          <input id="projectTitle" type="text" class="w-full px-6 py-4 bg-zinc-900 border border-zinc-700 rounded-2xl focus:border-violet-500 text-lg" placeholder="Enter project title here...">
        </div>

        <div>
          <label class="block text-sm font-medium mb-2 text-zinc-400">Project Description</label>
          <textarea id="projectDesc" rows="5" class="w-full px-6 py-5 bg-zinc-900 border border-zinc-700 rounded-3xl focus:border-violet-500 text-lg" placeholder="Describe the project requirements in detail..."></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium mb-2 text-zinc-400">Your Role</label>
            <select id="role" class="w-full px-6 py-4 bg-zinc-900 border border-zinc-700 rounded-2xl focus:border-violet-500 text-base">
              <option value="">Select your role</option>
              <optgroup label="Development">
                <option value="Full Stack Developer">Full Stack Developer</option>
                <option value="Frontend Developer">Frontend Developer</option>
                <option value="Backend Developer">Backend Developer</option>
                <option value="Mobile App Developer">Mobile App Developer</option>
                <option value="AI/ML Engineer">AI/ML Engineer</option>
                <option value="Data Scientist">Data Scientist</option>
                <option value="DevOps Engineer">DevOps Engineer</option>
                <option value="No-Code Developer">No-Code Developer</option>
              </optgroup>
              <optgroup label="Design & Creative">
                <option value="UI/UX Designer">UI/UX Designer</option>
                <option value="Graphic Designer">Graphic Designer</option>
                <option value="Brand Designer">Brand Designer</option>
                <option value="Motion Graphics Designer">Motion Graphics Designer</option>
                <option value="3D Artist">3D Artist</option>
              </optgroup>
              <optgroup label="Marketing & Content">
                <option value="Digital Marketer">Digital Marketer</option>
                <option value="Content Writer">Content Writer</option>
                <option value="Copywriter">Copywriter</option>
                <option value="SEO Specialist">SEO Specialist</option>
                <option value="Video Editor">Video Editor</option>
                <option value="Social Media Manager">Social Media Manager</option>
              </optgroup>
              <optgroup label="Others">
                <option value="Virtual Assistant">Virtual Assistant</option>
                <option value="Project Manager">Project Manager</option>
                <option value="Business Consultant">Business Consultant</option>
                <option value="AI Prompt Engineer">AI Prompt Engineer</option>
              </optgroup>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium mb-2 text-zinc-400">Budget (Optional)</label>
            <input id="budget" type="text" class="w-full px-6 py-4 bg-zinc-900 border border-zinc-700 rounded-2xl focus:border-violet-500 text-lg" placeholder="₹80,000 - ₹2,00,000">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium mb-3 text-zinc-400">Tone</label>
          <div class="grid grid-cols-3 md:grid-cols-6 gap-3">
            <button onclick="setTone(this)" data-tone="professional" class="tone-btn py-3.5 rounded-2xl border border-zinc-700 text-sm font-medium">Professional</button>
            <button onclick="setTone(this)" data-tone="friendly" class="tone-btn py-3.5 rounded-2xl border border-zinc-700 text-sm font-medium">Friendly</button>
            <button onclick="setTone(this)" data-tone="confident" class="tone-btn py-3.5 rounded-2xl border border-zinc-700 text-sm font-medium">Confident</button>
            <button onclick="setTone(this)" data-tone="persuasive" class="tone-btn py-3.5 rounded-2xl border border-zinc-700 text-sm font-medium">Persuasive</button>
            <button onclick="setTone(this)" data-tone="casual" class="tone-btn py-3.5 rounded-2xl border border-zinc-700 text-sm font-medium">Casual</button>
            <button onclick="setTone(this)" data-tone="enthusiastic" class="tone-btn py-3.5 rounded-2xl border border-zinc-700 text-sm font-medium">Enthusiastic</button>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium mb-2 text-zinc-400">Proposal Length</label>
          <select id="length" class="w-full px-6 py-4 bg-zinc-900 border border-zinc-700 rounded-2xl focus:border-violet-500">
            <option value="short">Short</option>
            <option value="medium" selected>Medium</option>
            <option value="detailed">Detailed</option>
          </select>
        </div>
      </div>

      <button onclick="generateProposal()" class="mt-12 w-full bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-700 hover:to-fuchsia-700 py-5 rounded-3xl font-bold text-xl transition">
        Generate Proposal →
      </button>
    </div>

    <div class="mt-12 max-w-md mx-auto text-center">
      <div class="glass p-8 rounded-3xl">
        <i class="fa-solid fa-info-circle text-4xl text-violet-400 mb-4"></i>
        <p class="text-zinc-400">Fill the details and click Generate.<br>Your proposal will open on the next page.</p>
      </div>
    </div>
  </div>

  <script>
    let proposals = JSON.parse(localStorage.getItem('propelProposals')) || [];
    let draftTimer = null;

    function updateHistoryCount() {
      document.getElementById('historyCount').textContent = proposals.length;
    }

    function setTone(btn) {
      document.querySelectorAll('.tone-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function generateProposal() {
      const data = {
        id: Date.now(),
        client: document.getElementById('clientName').value.trim() || "Valued Client",
        title: document.getElementById('projectTitle').value.trim() || "Untitled Project",
        desc: document.getElementById('projectDesc').value.trim(),
        role: document.getElementById('role').value || "Freelance Expert",
        budget: document.getElementById('budget').value.trim(),
        tone: document.querySelector('.tone-btn.active')?.dataset.tone || 'professional',
        length: document.getElementById('length').value,
        status: 'pending',
        date: new Date().toLocaleDateString('en-IN')
      };

      proposals.unshift(data);
      localStorage.setItem('propelProposals', JSON.stringify(proposals));
      updateHistoryCount();

      localStorage.setItem('currentProposal', JSON.stringify(data));
      window.location.href = "proposal.html";
    }

    function clearForm() {
      if (confirm("Clear all fields?")) {
        document.getElementById('clientName').value = '';
        document.getElementById('projectTitle').value = '';
        document.getElementById('projectDesc').value = '';
        document.getElementById('budget').value = '';
        document.getElementById('role').value = '';
        document.querySelectorAll('.tone-btn').forEach(b => b.classList.remove('active'));
      }
    }

    function goToHistory() {
      window.location.href = "history.html";
    }

    function autoSaveDraft() {
      if (draftTimer) clearTimeout(draftTimer);
      draftTimer = setTimeout(() => {
        const draft = {
          client: document.getElementById('clientName').value,
          title: document.getElementById('projectTitle').value,
          desc: document.getElementById('projectDesc').value,
          role: document.getElementById('role').value,
          budget: document.getElementById('budget').value
        };
        localStorage.setItem('lastDraft', JSON.stringify(draft));
      }, 1500);
    }

    window.onload = () => {
      updateHistoryCount();
      const lastDraft = JSON.parse(localStorage.getItem('lastDraft') || '{}');
      if (lastDraft.title) {
        document.getElementById('clientName').value = lastDraft.client || '';
        document.getElementById('projectTitle').value = lastDraft.title || '';
        document.getElementById('projectDesc').value = lastDraft.desc || '';
        document.getElementById('role').value = lastDraft.role || '';
        document.getElementById('budget').value = lastDraft.budget || '';
      }

      const inputs = ['clientName', 'projectTitle', 'projectDesc', 'budget'];
      inputs.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('input', autoSaveDraft);
      });
    };
  </script>
</body>
</html>
