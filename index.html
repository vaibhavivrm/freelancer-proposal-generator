<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PropelWrite - Freelance Proposal Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    .glass {
      background: rgba(24, 24, 27, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(63, 63, 70, 0.6);
    }

    .input-focus {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .input-focus:focus {
      border-color: rgb(124, 58, 237);
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.15);
      transform: translateY(-1px);
    }

    .tone-btn {
      transition: all 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
    }

    .tone-btn.active {
      background-color: #7c3aed;
      color: white;
      border-color: #7c3aed;
      transform: scale(1.05);
      box-shadow: 0 10px 15px -3px rgba(124, 58, 237, 0.3);
    }

    .gradient-text {
      background: linear-gradient(to right, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans">

  <!-- Header -->
  <header class="border-b border-zinc-800 bg-zinc-950/80 backdrop-blur-xl sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-6 py-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 bg-gradient-to-br from-violet-500 via-fuchsia-500 to-pink-500 rounded-2xl flex items-center justify-center shadow-lg shadow-violet-500/30">
          <i class="fa-solid fa-rocket text-white text-3xl"></i>
        </div>
        <div>
          <h1 class="text-3xl font-bold tracking-tighter gradient-text">PropelWrite</h1>
          <p class="text-[10px] text-zinc-500 -mt-1 tracking-[1px]">FREELANCE PROPOSALS</p>
        </div>
      </div>

      <button onclick="goToHistory()" 
              class="flex items-center gap-3 px-7 py-3 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 hover:border-violet-500 rounded-3xl font-medium transition-all duration-300">
        <i class="fa-solid fa-history text-violet-400"></i>
        <span>History</span>
        <span id="historyCount" class="bg-zinc-800 text-violet-400 text-xs font-mono px-3 py-1 rounded-full">0</span>
      </button>
    </div>
  </header>

  <div class="max-w-4xl mx-auto px-6 py-16">
    <!-- Hero -->
    <div class="text-center mb-16">
      <div class="inline-flex items-center gap-2 bg-zinc-900 border border-zinc-700 rounded-full px-5 py-2 mb-6">
        <div class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></div>
        <span class="text-sm font-medium text-emerald-400">AI-Powered • Instant</span>
      </div>
      <h1 class="text-6xl font-bold tracking-tighter mb-4 leading-none">
        Win More Projects<br>with <span class="gradient-text">Better Proposals</span>
      </h1>
      <p class="text-xl text-zinc-400 max-w-lg mx-auto">
        Professional, personalized proposals that get responses — generated in seconds.
      </p>
    </div>

    <!-- Main Form -->
    <div class="glass rounded-3xl p-10 shadow-2xl">
      <div class="flex justify-between items-center mb-10">
        <h2 class="text-3xl font-semibold flex items-center gap-3">
          <i class="fa-solid fa-pen-nib text-violet-400"></i>
          Project Details
        </h2>
        <button onclick="clearForm()" 
                class="flex items-center gap-2 px-6 py-3 text-zinc-400 hover:text-red-400 hover:bg-red-950/30 rounded-2xl transition-all">
          <i class="fa-solid fa-trash-can"></i>
          <span class="font-medium">Clear Form</span>
        </button>
      </div>

      <div class="space-y-10">
        <!-- Client & Project -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium mb-2 text-zinc-400">Client Name</label>
            <input id="clientName" type="text" 
                   class="input-focus w-full px-6 py-4 bg-zinc-900 border border-zinc-700 rounded-2xl focus:border-violet-500 text-lg placeholder-zinc-500"
                   placeholder="e.g. Priya Sharma">
          </div>
          <div>
            <label class="block text-sm font-medium mb-2 text-zinc-400">Project Title</label>
            <input id="projectTitle" type="text" 
                   class="input-focus w-full px-6 py-4 bg-zinc-900 border border-zinc-700 rounded-2xl focus:border-violet-500 text-lg placeholder-zinc-500"
                   placeholder="Website Redesign for Fashion Brand">
          </div>
        </div>

        <!-- Description -->
        <div>
          <label class="block text-sm font-medium mb-2 text-zinc-400">Project Description</label>
          <textarea id="projectDesc" rows="6" 
                    class="input-focus w-full px-6 py-5 bg-zinc-900 border border-zinc-700 rounded-3xl focus:border-violet-500 text-lg resize-y placeholder-zinc-500"
                    placeholder="Describe the project requirements, goals, timeline, and any specific deliverables..."></textarea>
        </div>

        <!-- Role, Budget, Length -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div>
            <label class="block text-sm font-medium mb-2 text-zinc-400">Your Role</label>
            <select id="role" 
                    class="input-focus w-full px-6 py-4 bg-zinc-900 border border-zinc-700 rounded-2xl focus:border-violet-500 text-base">
              <option value="">Select your role</option>
              <optgroup label="Development">
                <option value="Full Stack Developer">Full Stack Developer</option>
                <option value="Frontend Developer">Frontend Developer</option>
                <option value="Backend Developer">Backend Developer</option>
                <option value="Mobile App Developer">Mobile App Developer</option>
                <option value="AI/ML Engineer">AI/ML Engineer</option>
                <option value="DevOps Engineer">DevOps Engineer</option>
              </optgroup>
              <optgroup label="Design & Creative">
                <option value="UI/UX Designer">UI/UX Designer</option>
                <option value="Graphic Designer">Graphic Designer</option>
                <option value="Brand Designer">Brand Designer</option>
              </optgroup>
              <optgroup label="Marketing & Content">
                <option value="Content Writer">Content Writer</option>
                <option value="Copywriter">Copywriter</option>
                <option value="Digital Marketer">Digital Marketer</option>
                <option value="SEO Specialist">SEO Specialist</option>
              </optgroup>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium mb-2 text-zinc-400">Project Budget</label>
            <div class="flex items-center bg-zinc-900 border border-zinc-700 rounded-2xl px-6 py-4 input-focus">
              <span class="text-2xl text-zinc-400 mr-3">₹</span>
              <input id="budget" type="number" placeholder="45000" 
                     class="w-full bg-transparent outline-none text-lg placeholder-zinc-500">
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium mb-2 text-zinc-400">Proposal Length</label>
            <select id="length" 
                    class="input-focus w-full px-6 py-4 bg-zinc-900 border border-zinc-700 rounded-2xl focus:border-violet-500">
              <option value="short">Short (Concise)</option>
              <option value="medium" selected>Medium (Recommended)</option>
              <option value="detailed">Detailed (Comprehensive)</option>
            </select>
          </div>
        </div>

        <!-- Tone -->
        <div>
          <label class="block text-sm font-medium mb-4 text-zinc-400">Proposal Tone</label>
          <div class="grid grid-cols-3 md:grid-cols-6 gap-3">
            <button onclick="setTone(this)" data-tone="professional" class="tone-btn py-4 rounded-2xl border border-zinc-700 text-sm font-medium hover:border-violet-400">Professional</button>
            <button onclick="setTone(this)" data-tone="friendly" class="tone-btn py-4 rounded-2xl border border-zinc-700 text-sm font-medium hover:border-violet-400">Friendly</button>
            <button onclick="setTone(this)" data-tone="confident" class="tone-btn py-4 rounded-2xl border border-zinc-700 text-sm font-medium hover:border-violet-400">Confident</button>
            <button onclick="setTone(this)" data-tone="persuasive" class="tone-btn py-4 rounded-2xl border border-zinc-700 text-sm font-medium hover:border-violet-400">Persuasive</button>
            <button onclick="setTone(this)" data-tone="casual" class="tone-btn py-4 rounded-2xl border border-zinc-700 text-sm font-medium hover:border-violet-400">Casual</button>
            <button onclick="setTone(this)" data-tone="enthusiastic" class="tone-btn py-4 rounded-2xl border border-zinc-700 text-sm font-medium hover:border-violet-400">Enthusiastic</button>
          </div>
        </div>
      </div>

      <!-- Generate Button -->
      <button onclick="generateProposal()" 
              class="mt-14 w-full bg-gradient-to-r from-violet-600 via-fuchsia-600 to-pink-600 hover:from-violet-700 hover:via-fuchsia-700 hover:to-pink-700 py-6 rounded-3xl font-bold text-xl tracking-wide shadow-xl shadow-violet-500/30 transition-all duration-300 flex items-center justify-center gap-3 hover:scale-[1.02]">
        <span>Generate Winning Proposal</span>
        <i class="fa-solid fa-arrow-right text-xl"></i>
      </button>
    </div>

    <!-- Info -->
    <div class="mt-12 max-w-md mx-auto text-center">
      <div class="glass p-8 rounded-3xl border border-violet-500/10">
        <div class="flex justify-center mb-4">
          <i class="fa-solid fa-wand-magic-sparkles text-5xl text-violet-400"></i>
        </div>
        <p class="text-zinc-400 leading-relaxed">
          Fill in the details above and let AI craft a personalized, high-conversion proposal for you.
        </p>
      </div>
    </div>
  </div>

  <script>
    let proposals = JSON.parse(localStorage.getItem('propelProposals')) || [];
    let draftTimer = null;

    function updateHistoryCount() {
      document.getElementById('historyCount').textContent = proposals.length;
    }

    function setTone(btn) {
      document.querySelectorAll('.tone-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function generateProposal() {
      const data = {
        id: Date.now(),
        client: document.getElementById('clientName').value.trim() || "Valued Client",
        title: document.getElementById('projectTitle').value.trim() || "Untitled Project",
        desc: document.getElementById('projectDesc').value.trim(),
        role: document.getElementById('role').value || "Freelance Expert",
        budget: document.getElementById('budget').value.trim(),
        tone: document.querySelector('.tone-btn.active')?.dataset.tone || 'professional',
        length: document.getElementById('length').value,
        status: 'pending',
        date: new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })
      };

      proposals.unshift(data);
      localStorage.setItem('propelProposals', JSON.stringify(proposals));
      updateHistoryCount();

      localStorage.setItem('currentProposal', JSON.stringify(data));
      window.location.href = "proposal.html";
    }

    function clearForm() {
      if (confirm("Clear all fields?")) {
        document.getElementById('clientName').value = '';
        document.getElementById('projectTitle').value = '';
        document.getElementById('projectDesc').value = '';
        document.getElementById('budget').value = '';
        document.getElementById('role').value = '';
        document.querySelectorAll('.tone-btn').forEach(b => b.classList.remove('active'));
      }
    }

    function goToHistory() {
      window.location.href = "history.html";
    }

    function autoSaveDraft() {
      if (draftTimer) clearTimeout(draftTimer);
      draftTimer = setTimeout(() => {
        const draft = {
          client: document.getElementById('clientName').value,
          title: document.getElementById('projectTitle').value,
          desc: document.getElementById('projectDesc').value,
          role: document.getElementById('role').value,
          budget: document.getElementById('budget').value
        };
        localStorage.setItem('lastDraft', JSON.stringify(draft));
      }, 1200);
    }

    window.onload = () => {
      updateHistoryCount();

      // Load last draft
      const lastDraft = JSON.parse(localStorage.getItem('lastDraft') || '{}');
      if (lastDraft.title) {
        document.getElementById('clientName').value = lastDraft.client || '';
        document.getElementById('projectTitle').value = lastDraft.title || '';
        document.getElementById('projectDesc').value = lastDraft.desc || '';
        document.getElementById('role').value = lastDraft.role || '';
        document.getElementById('budget').value = lastDraft.budget || '';
      }

      // Auto-save listeners
      const inputs = ['clientName', 'projectTitle', 'projectDesc', 'budget', 'role'];
      inputs.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('input', autoSaveDraft);
      });
    };
  </script>
</body>
</html>
